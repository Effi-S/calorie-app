[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "calorie_count"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kivy>=2.3.1",
    "kivymd==2.0.0",
    "sqlalchemy>=2.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
calorie-app = "calorie_count.__main__:main"

# Development dependencies (PEP 735). Install with: uv sync
[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Match the layout: linting the package, excluding generated/vendored assets.
extend-exclude = ["calorie_count/lib", "*.kv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (unused imports/vars, undefined names)
    "I",  # isort (import sorting)
    "UP", # pyupgrade (modern syntax)
]
# Line length is managed by the formatter; it won't split long strings/comments.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# matplotlib backend must be selected before pyplot is imported (see file header).
"calorie_count/src/utils/plotting.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["calorie_count/tests/unit_tests"]
python_files = ["test_*.py"]
